name: DataHz2 CI

on:
  push:
    paths:
      - "DataHz2/**"
      - ".github/workflows/datahz2-ci.yml"
      - ".github/workflows/datahz2-release.yml"
  pull_request:
    paths:
      - "DataHz2/**"
      - ".github/workflows/datahz2-ci.yml"
      - ".github/workflows/datahz2-release.yml"
  workflow_dispatch:

concurrency:
  group: datahz2-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('DataHz2/**/*.csproj', 'DataHz2/**/*.props', 'DataHz2/**/*.targets', 'DataHz2/global.json', 'DataHz2/nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Validate PowerShell scripts
        run: .\DataHz2\scripts\validate-scripts.ps1

      - name: Check history/deployment-status audits
        run: .\DataHz2\scripts\check-history-audits.ps1

      - name: Check CI workflow contracts
        run: .\DataHz2\scripts\check-ci-contracts.ps1

      - name: Check documentation sync
        run: .\DataHz2\scripts\check-docs-sync.ps1

      - name: Restore
        run: dotnet restore .\DataHz2\DataHz2.sln

      - name: Build
        run: dotnet build .\DataHz2\DataHz2.sln -c Release --no-restore

      - name: Test
        run: dotnet test .\DataHz2\DataHz2.sln -c Release --no-build

  package-verify:
    needs: build-test
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        runtime: ["win-x64", "win-arm64"]

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('DataHz2/**/*.csproj', 'DataHz2/**/*.props', 'DataHz2/**/*.targets', 'DataHz2/global.json', 'DataHz2/nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore (runtime-specific)
        run: |
          $runtime = "${{ matrix.runtime }}"
          dotnet restore .\DataHz2\DataHz2.sln -r $runtime

      - name: Publish package
        run: |
          $runtime = "${{ matrix.runtime }}"
          $publishDir = ".\DataHz2\artifacts\publish\ci-$runtime"
          .\DataHz2\scripts\publish-api.ps1 `
            -Configuration Release `
            -Runtime $runtime `
            -OutputDir $publishDir `
            -FrameworkDependent `
            -MultiFile `
            -NoRestore

      - name: Create release zip
        run: |
          $runtime = "${{ matrix.runtime }}"
          $publishDir = ".\DataHz2\artifacts\publish\ci-$runtime"
          $packageName = "datahz2-api-$runtime"
          .\DataHz2\scripts\package-release.ps1 `
            -InputDir $publishDir `
            -OutputDir .\DataHz2\artifacts\packages `
            -Name $packageName `
            -Overwrite

      - name: Verify release package
        run: |
          $runtime = "${{ matrix.runtime }}"
          .\DataHz2\scripts\verify-release.ps1 `
            -PackageZip ".\DataHz2\artifacts\packages\datahz2-api-$runtime.zip"

      - name: Check deploy guards
        run: |
          $runtime = "${{ matrix.runtime }}"
          $packageZip = ".\DataHz2\artifacts\packages\datahz2-api-$runtime.zip"
          .\DataHz2\scripts\check-deploy-guards.ps1 `
            -PackageZip $packageZip

      - name: Check deploy guards auto-package fallback
        if: matrix.runtime == 'win-x64'
        run: |
          .\DataHz2\scripts\check-deploy-guards.ps1 `
            -PackageZip ".\DataHz2\artifacts\packages\datahz2-api-win-x64-fallback.zip" `
            -IncludeOnlineSmokeCase `
            -OnlineSmokeStartupSeconds 6

      - name: Assert fallback package cleanup
        if: matrix.runtime == 'win-x64'
        run: |
          $base = ".\DataHz2\artifacts\packages\datahz2-api-win-x64-fallback"
          $candidates = @(
            "$base.zip",
            "$base.sha256",
            "$base.manifest.json"
          )
          $leftovers = @($candidates | Where-Object { Test-Path $_ })
          if ($leftovers.Count -gt 0) {
            $joined = $leftovers -join ", "
            throw "Fallback package cleanup failed. Leftover files: $joined"
          }
          Write-Host "Fallback package cleanup verified."

      - name: Smoke test
        if: matrix.runtime == 'win-x64'
        run: |
          $publishDir = (Resolve-Path .\DataHz2\artifacts\publish\ci-win-x64).Path
          $apiExe = Join-Path $publishDir "DataHz.Api.exe"
          if (-not (Test-Path $apiExe)) {
            throw "API executable not found: $apiExe"
          }

          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = ($listener.LocalEndpoint).Port
          $listener.Stop()
          $smokeUrl = "http://127.0.0.1:$port"
          $outLog = Join-Path $env:RUNNER_TEMP "datahz2-api-smoke.out.log"
          $errLog = Join-Path $env:RUNNER_TEMP "datahz2-api-smoke.err.log"
          $reportLog = Join-Path $env:RUNNER_TEMP "datahz2-api-smoke.report.json"
          $proc = $null

          try {
            $proc = Start-Process `
              -FilePath $apiExe `
              -ArgumentList @("--contentRoot", $publishDir, "--environment", "Production", "--urls", $smokeUrl) `
              -PassThru `
              -WindowStyle Hidden `
              -RedirectStandardOutput $outLog `
              -RedirectStandardError $errLog

            Start-Sleep -Seconds 6
            .\DataHz2\scripts\smoke-test-api.ps1 `
              -BaseUrl $smokeUrl `
              -TimeoutSeconds 120 `
              -CheckRetryCount 5 `
              -CheckRetryDelayMilliseconds 800 `
              -HealthPollDelayMilliseconds 500 `
              -WarnCheckDurationMilliseconds 3000 `
              -FailCheckDurationMilliseconds 0 `
              -OutputJsonPath $reportLog
          }
          catch {
            if (Test-Path $outLog) {
              Write-Host "----- DataHz2 API smoke stdout -----"
              Get-Content $outLog
            }
            if (Test-Path $errLog) {
              Write-Host "----- DataHz2 API smoke stderr -----"
              Get-Content $errLog
            }
            if (Test-Path $reportLog) {
              Write-Host "----- DataHz2 API smoke structured report -----"
              Get-Content $reportLog
            }
            throw
          }
          finally {
            if ($null -ne $proc -and -not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Publish smoke summary
        if: matrix.runtime == 'win-x64' && always()
        run: |
          $reportLog = Join-Path $env:RUNNER_TEMP "datahz2-api-smoke.report.json"
          $lines = New-Object System.Collections.Generic.List[string]
          $lines.Add("### DataHz2 CI smoke summary (win-x64)")
          $lines.Add("")

          if (-not (Test-Path $reportLog)) {
            $lines.Add("Smoke report file not found: `$reportLog`.")
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ($lines -join [Environment]::NewLine)
            return
          }

          $report = Get-Content -Path $reportLog -Raw | ConvertFrom-Json
          $lines.Add("- BaseUrl: $($report.baseUrl)")
          $lines.Add("- Total checks: $($report.totalChecks)")
          $lines.Add("- Failed checks: $($report.failedChecks)")
          $lines.Add("- Elapsed ms: $($report.elapsedMilliseconds)")
          $lines.Add("- Avg check ms: $($report.averageCheckDurationMs)")
          $lines.Add("- Max check: $($report.maxCheckName) ($($report.maxCheckDurationMs) ms)")
          $lines.Add("- Health poll delay ms: $($report.healthPollDelayMilliseconds)")
          $lines.Add("- Warn slow threshold ms: $($report.warnCheckDurationMilliseconds) (count=$($report.warnSlowCheckCount))")
          $lines.Add("- Fail slow threshold ms: $($report.failCheckDurationMilliseconds) (count=$($report.failSlowCheckCount))")
          $lines.Add("")

          $lines.Add("Top 3 slow checks:")
          $lines.Add("")
          $lines.Add("| Check | Duration ms | Attempts | Endpoint |")
          $lines.Add("| --- | ---: | ---: | --- |")
          $slowest = @($report.results | Sort-Object DurationMs -Descending | Select-Object -First 3)
          foreach ($item in $slowest) {
            $lines.Add("| $($item.Check) | $($item.DurationMs) | $($item.Attempts) | $($item.Endpoint) |")
          }
          $lines.Add("")

          if ([int]$report.failedChecks -gt 0) {
            $lines.Add("| Check | Attempts | Endpoint | Detail |")
            $lines.Add("| --- | ---: | --- | --- |")
            $failed = @($report.results | Where-Object { -not $_.Passed })
            foreach ($item in $failed) {
              $detail = [string]$item.Detail
              $detail = $detail.Replace("|", "\|")
              $lines.Add("| $($item.Check) | $($item.Attempts) | $($item.Endpoint) | $detail |")
            }
          }
          else {
            $lines.Add("All smoke checks passed.")
          }

          if ([int]$report.warnSlowCheckCount -gt 0) {
            $lines.Add("")
            $lines.Add("Slow-check warnings:")
            $lines.Add("| Check | Duration ms | Attempts | Endpoint |")
            $lines.Add("| --- | ---: | ---: | --- |")
            foreach ($item in @($report.warnSlowChecks)) {
              $lines.Add("| $($item.Check) | $($item.DurationMs) | $($item.Attempts) | $($item.Endpoint) |")
            }
          }

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ($lines -join [Environment]::NewLine)

      - name: Upload smoke diagnostics
        if: matrix.runtime == 'win-x64' && always()
        uses: actions/upload-artifact@v4
        with:
          name: datahz2-${{ matrix.runtime }}-smoke-diagnostics
          path: |
            ${{ runner.temp }}/datahz2-api-smoke.out.log
            ${{ runner.temp }}/datahz2-api-smoke.err.log
            ${{ runner.temp }}/datahz2-api-smoke.report.json
          if-no-files-found: warn

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: datahz2-${{ matrix.runtime }}-package
          path: |
            DataHz2/artifacts/packages/datahz2-api-${{ matrix.runtime }}.zip
            DataHz2/artifacts/packages/datahz2-api-${{ matrix.runtime }}.sha256
            DataHz2/artifacts/packages/datahz2-api-${{ matrix.runtime }}.manifest.json
          if-no-files-found: error
